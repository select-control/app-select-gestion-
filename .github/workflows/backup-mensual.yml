name: Backup mensual de datos (Select Control)

# Copia de seguridad automatica de los datos de Supabase (via API REST).
# - Se ejecuta el dia 1 de cada mes (03:00 UTC).
# - Tambien se puede lanzar a mano desde la pestana "Actions" (Run workflow).
# Los backups se guardan en la rama "backups" de este repo (no en main), asi
# que NO disparan ningun deploy de Vercel.
#
# REQUISITO: definir el secreto de repositorio SUPABASE_SECRET_KEY
#   (Settings > Secrets and variables > Actions) con la clave SECRETA
#   (sb_secret_...) de la API de Supabase.

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backup-datos-select
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main, para el script de backup)
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar el backup
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OUT_DIR: ${{ runner.temp }}/backups
        run: node scripts/backup-datos.mjs

      - name: Guardar en la rama 'backups'
        env:
          OUT_DIR: ${{ runner.temp }}/backups
        run: |
          git config user.name "backup-bot"
          git config user.email "backup@dfe.local"
          git fetch origin backups || true
          if git show-ref --verify --quiet refs/remotes/origin/backups; then
            git checkout -B backups origin/backups
          else
            git checkout --orphan backups
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p backups
          cp "$OUT_DIR"/*.json.gz backups/
          [ -f "$OUT_DIR/esquema.sql" ] && cp "$OUT_DIR/esquema.sql" backups/esquema.sql || true
          git add backups
          if git diff --cached --quiet; then
            echo "Sin cambios en el backup de este mes."
            exit 0
          fi
          git commit -m "backup: datos $(date -u +%Y-%m)"
          git push origin backups
